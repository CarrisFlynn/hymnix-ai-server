<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>慧梦网关 · 连接监控</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel2:#1b222b; --line:#252d38;
    --text:#e6e9ee; --muted:#8b95a3; --dim:#5d6875;
    --ok:#3ecf8e; --warn:#e0a83c; --err:#f06a63; --accent:#5b9cf8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#172033 0%,var(--bg) 60%);
       color:var(--text);font:14px/1.6 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);
         backdrop-filter:blur(8px);position:sticky;top:0;background:rgba(15,18,22,.82);z-index:5}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3a6df0,#7b4cf0);
        display:grid;place-items:center;font-weight:700;font-size:15px}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .pill{padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);
        display:flex;align-items:center;gap:7px;background:var(--panel)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok);box-shadow:0 0 10px rgba(62,207,142,.7)}
  .dot.err{background:var(--err);box-shadow:0 0 10px rgba(240,106,99,.6)}
  main{max-width:1240px;margin:0 auto;padding:22px 26px 60px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card .k{color:var(--muted);font-size:12px;letter-spacing:.5px}
  .card .v{font-size:26px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
  .cols{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
  @media (max-width:980px){.cols{grid-template-columns:1fr}}
  h2{font-size:13px;letter-spacing:1.2px;color:var(--muted);margin:0 0 12px;font-weight:600}
  .client{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .client .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ip{font-family:Consolas,monospace;font-size:13px}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#20293a;color:var(--muted)}
  .tag.on{background:rgba(62,207,142,.14);color:var(--ok)}
  .meta{color:var(--dim);font-size:12px;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
  .conv{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .conv .head{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;user-select:none}
  .conv .head:hover{background:var(--panel2)}
  .time{font-family:Consolas,monospace;font-size:12px;color:var(--muted);min-width:56px}
  .badge{font-size:11px;padding:2px 8px;border-radius:6px;background:#20293a;color:var(--muted)}
  .badge.ok{background:rgba(62,207,142,.12);color:var(--ok)}
  .badge.err{background:rgba(240,106,99,.12);color:var(--err)}
  .preview{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .preview .who{color:var(--accent)}
  .body{display:none;border-top:1px solid var(--line);padding:14px;background:#12171e}
  .conv.open .body{display:block}
  .msg{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:#171d26;border-left:3px solid var(--dim)}
  .msg.user{border-left-color:var(--accent)}
  .msg.system{border-left-color:var(--warn)}
  .msg.assistant{border-left-color:var(--ok)}
  .msg .role{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
  .msg .txt{white-space:pre-wrap;word-break:break-word;font-size:13px}
  .kv{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:12px}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  input.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
      border-radius:10px;padding:9px 12px;font:inherit;outline:none;margin-bottom:14px}
  input.search:focus{border-color:#3a4a60}
  .footnote{margin-top:26px;color:var(--dim);font-size:12px;line-height:1.9}
</style>
</head>
<body>
<header>
  <div class="logo">慧</div>
  <div>
    <h1>慧梦网关 · 连接监控</h1>
    <div class="sub" id="listen">--</div>
  </div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="gwDot"></span><span id="gwTxt">网关</span></div>
  <div class="pill"><span class="dot" id="olDot"></span><span id="olTxt">Ollama</span></div>
  <div class="pill" id="clock">--:--:--</div>
</header>

<main>
  <div class="stats">
    <div class="card"><div class="k">在线客户端</div><div class="v" id="sOnline">0</div></div>
    <div class="card"><div class="k">累计请求</div><div class="v" id="sReq">0</div></div>
    <div class="card"><div class="k">对话记录</div><div class="v" id="sConv">0</div></div>
    <div class="card"><div class="k">已加载模型</div><div class="v" id="sModel" style="font-size:15px;line-height:1.5">--</div></div>
    <div class="card"><div class="k">运行时长</div><div class="v" id="sUp" style="font-size:20px">--</div></div>
  </div>

  <div class="cols">
    <section>
      <h2>客户端连接</h2>
      <div id="clients"><div class="empty">暂无连接</div></div>
      <div class="footnote">只有携带正确密钥的请求才会出现在这里。最近 120 秒内有请求即视为在线。</div>
    </section>

    <section>
      <h2>实时对话</h2>
      <input class="search" id="q" placeholder="搜索对话内容 / IP / 模型…">
      <div id="convs"><div class="empty">还没有对话记录</div></div>
    </section>
  </div>
</main>

<script>
var $ = function(s){ return document.querySelector(s); };
var KEY = new URLSearchParams(location.search).get('key') || localStorage.getItem('hymnix_admin_key') || '';
if (KEY) { localStorage.setItem('hymnix_admin_key', KEY); }
var OPEN = new Set();
var LAST = [];
function ESC(s){
  if (s === null || s === undefined) { s = ''; }
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDur(s){
  s = Number(s) || 0;
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return (h ? h + ' 小时 ' : '') + (m ? m + ' 分 ' : '') + (s%60) + ' 秒';
}
function fmtTime(iso){
  if (!iso) { return '--'; }
  var m = iso.match(/T(\d{2}:\d{2}:\d{2})/);
  return m ? m[1] : iso;
}
function api(path){
  return fetch(path, {headers:{'X-Admin-Key': KEY}}).then(function(r){
    if (r.status === 401) { throw new Error('管理密钥无效：请在地址后加 ?key=你的管理密钥'); }
    return r.json();
  });
}
function renderClients(clients){
  var box = $('#clients');
  if (!clients || !clients.length) { box.innerHTML = '<div class="empty">暂无连接</div>'; return; }
  var out = [];
  clients.forEach(function(c){
    out.push(
      '<div class="client"><div class="row1"><span class="ip">' + ESC(c.ip) + '</span>' +
      '<span class="tag ' + (c.online ? 'on' : '') + '">' + (c.online ? '在线' : '离线') + '</span></div>' +
      '<div class="meta"><span>请求 ' + c.requests + '</span><span>对话 ' + c.conversations + '</span></div>' +
      '<div class="meta"><span>最近 ' + ESC(c.last_seen) + '</span><span>模型 ' + ESC(c.last_model || '--') + '</span></div>' +
      (c.last_prompt ? '<div class="meta" style="margin-top:6px;color:var(--muted)">“' + ESC(c.last_prompt) + '”</div>' : '') +
      '</div>'
    );
  });
  box.innerHTML = out.join('');
}
function renderConvs(items, keyword){
  var box = $('#convs');
  var list = (items || []).slice();
  if (keyword) {
    var k = keyword.toLowerCase();
    list = list.filter(function(it){ return JSON.stringify(it).toLowerCase().indexOf(k) >= 0; });
  }
  if (!list.length) { box.innerHTML = '<div class="empty">没有匹配的对话</div>'; return; }
  var out = [];
  list.forEach(function(it){
    var id = it.id || (it.t + it.ip);
    var open = OPEN.has(id);
    var msgs = (it.messages || []).map(function(m){
      var cls = m.role === 'user' ? 'user' : (m.role === 'system' ? 'system' : 'assistant');
      return '<div class="msg ' + cls + '"><div class="role">' + ESC(m.role) + '</div>' +
             '<div class="txt">' + ESC(m.content) + '</div></div>';
    }).join('');
    var preview = (it.messages || []).filter(function(m){ return m.role === 'user'; }).slice(-1)[0];
    var pv = preview ? preview.content : '';
    var ok = !it.error;
    out.push(
      '<div class="conv ' + (open ? 'open' : '') + '" data-id="' + ESC(id) + '">' +
        '<div class="head"><span class="time">' + ESC(fmtTime(it.t)) + '</span>' +
        '<span class="badge">' + ESC(it.ip || '') + '</span>' +
        '<span class="badge">' + ESC(it.model || '') + '</span>' +
        '<span class="preview"><span class="who">用户：</span>' + ESC(pv.slice(0, 120)) + '</span>' +
        '<span class="badge ' + (ok ? 'ok' : 'err') + '">' + (ok ? (it.elapsed_ms ? it.elapsed_ms + 'ms' : '完成') : '错误') + '</span></div>' +
        '<div class="body"><div class="kv">' +
          '<span>时间 ' + ESC(it.t || '') + '</span>' +
          '<span>来源 ' + ESC(it.ip || '') + '</span>' +
          '<span>模型 ' + ESC(it.model || '') + '</span>' +
          '<span>流式 ' + (it.stream ? '是' : '否') + '</span>' +
          '<span>输入 ' + (it.prompt_tokens === undefined || it.prompt_tokens === null ? '--' : it.prompt_tokens) + ' tok</span>' +
          '<span>输出 ' + (it.reply_tokens === undefined || it.reply_tokens === null ? '--' : it.reply_tokens) + ' tok</span>' +
          '<span>耗时 ' + (it.elapsed_ms === undefined ? '--' : it.elapsed_ms) + ' ms</span></div>' +
          msgs +
          '<div class="msg assistant"><div class="role">网关记录的完整回复</div><div class="txt">' + ESC(it.reply || '（空）') + '</div></div>' +
          (it.error ? '<div class="msg" style="border-left-color:var(--err)"><div class="role">错误</div><div class="txt">' + ESC(it.error) + '</div></div>' : '') +
        '</div></div>'
    );
  });
  box.innerHTML = out.join('');
  box.querySelectorAll('.conv .head').forEach(function(h){
    h.onclick = function(){
      var card = h.parentElement;
      var id = card.getAttribute('data-id');
      card.classList.toggle('open');
      if (card.classList.contains('open')) { OPEN.add(id); } else { OPEN.delete(id); }
    };
  });
}
function tick(){
  $('#clock').textContent = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  api('/admin/status').then(function(s){
    $('#gwDot').className = 'dot ok';
    $('#gwTxt').textContent = '网关在线';
    var olOk = s.ollama && s.ollama.online;
    $('#olDot').className = 'dot ' + (olOk ? 'ok' : 'err');
    $('#olTxt').textContent = olOk ? ('Ollama ' + (s.ollama.version || '')) : 'Ollama 离线';
    $('#listen').textContent = '监听 ' + s.gateway.listen + ' · v' + s.gateway.version;
    $('#sOnline').textContent = s.online || 0;
    $('#sReq').textContent = s.stats.requests;
    $('#sConv').textContent = s.stats.conversations;
    var loaded = (s.ollama && s.ollama.loaded) || [];
    $('#sModel').innerHTML = loaded.length
      ? loaded.map(function(m){ return '<div>' + ESC(m) + '</div>'; }).join('')
      : '<span style="color:var(--muted);font-size:14px">未加载</span>';
    $('#sUp').textContent = fmtDur(s.gateway.uptime_s);
    renderClients(s.clients);
    LAST = s.recent || [];
    renderConvs(LAST, $('#q').value.trim());
  }).catch(function(e){
    $('#gwDot').className = 'dot err';
    $('#gwTxt').textContent = '网关不可达';
    $('#olDot').className = 'dot err';
    $('#olTxt').textContent = e.message || '连接失败';
  });
}
$('#q').addEventListener('input', function(){ renderConvs(LAST, $('#q').value.trim()); });
setInterval(tick, 2000);
tick();
</script>
</body>
</html>
