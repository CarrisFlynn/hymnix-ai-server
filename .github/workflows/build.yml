name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: backend (gateway)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compile check
        run: python -m py_compile server/gateway_core.py server/hxcore/paths.py
      - name: Build gateway
        run: |
          cd server
          python -m PyInstaller hymnix-server.spec --noconfirm --clean --distpath ..
      - uses: actions/upload-artifact@v4
        with:
          name: hymnix-gateway
          path: hymnix-server-*-x64.exe

  desktop:
    name: desktop (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: desktop
        run: pnpm typecheck
      - name: Tests
        working-directory: desktop
        run: pnpm test
      - name: Build renderer and main
        working-directory: desktop
        run: pnpm build
      - name: Package unpacked app
        working-directory: desktop
        run: pnpm exec electron-builder --win --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: hymnix-desktop
          path: desktop/release/win-unpacked
